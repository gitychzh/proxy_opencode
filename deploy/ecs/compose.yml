# 0.7.x 新栈：ECS 网关容器。
#
# 用法（在 deploy/ecs/ 下）：
#   cp env.example .env      # 填入真实凭据（.env 已 gitignore，绝不提交）
#   docker compose up -d --build
#
# 只把 10002 发布到宿主机 loopback，由 caddy:10002 反代对外（见
# Caddyfile.snippet）。容器本身不暴露公网端口。
services:
  zen-gw:
    build:
      context: ../..
      dockerfile: deploy/ecs/Dockerfile
    image: zen-gw:0.7
    container_name: zen-gw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "10002"
      # 动态 key 库落在挂载卷里（容器只读根文件系统）。
      KEY_STORE_PATH: /data/keys.json
    ports:
      - "127.0.0.1:10002:10002"
    volumes:
      - ./data:/data
    # 只读根文件系统 + 可写 /tmp 与 /data：缩小攻击面，重启不丢 key 库。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "8m"
        max-file: "3"
