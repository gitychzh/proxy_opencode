# 0.7.x 新栈：ECS 网关容器。
#
# 用法（在 deploy/ecs/ 下）：
#   cp env.example .env      # 填入真实凭据（.env 已 gitignore，绝不提交）
#   docker compose up -d --build
#
# 宿主机直接发布 **10002**：容器即客户端入口，明文 HTTP + API key 鉴权。
#
# 历史（勿删，保真）：0.7.x 早期是「caddy 监听 :10002 (自签/LE TLS) → 反代
# 127.0.0.1:10010」，容器只绑 loopback。2026-10-28 起取消该链路——客户端装
# 证书的代价远大于收益（用户明确否决证书方案），改为网关直接监听公网 10002。
# 若将来恢复 TLS，则需要重新让出 10002 给 caddy、把这里改回 loopback。
services:
  zen-gw:
    build:
      context: ../..
      dockerfile: deploy/ecs/Dockerfile
    image: zen-gw:0.7
    container_name: zen-gw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "10002"
      # 动态 key 库落在挂载卷里（容器只读根文件系统）。
      KEY_STORE_PATH: /data/keys.json
    ports:
      # 公网直连：网关自己监听 10002，客户端只需 API key，无需证书/反代。
      # 2026-10-28 由 127.0.0.1:10010:10002 改为 10002:10002（用户明确要求去掉证书链路）。
      - "10002:10002"
    volumes:
      - ./data:/data
    # 只读根文件系统 + 可写 /tmp 与 /data：缩小攻击面，重启不丢 key 库。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "8m"
        max-file: "3"
