name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install package with test + dev deps
        run: pip install -e '.[test,dev]'

      # Lint and type gates are unconditional: the previous "only if ruff is
      # installed" guard meant they silently never ran in CI.
      - name: Ruff
        run: ruff check proxy_opencode tests balancer

      - name: Mypy
        run: mypy proxy_opencode

      - name: Run tests
        run: pytest tests/ -q

  balancer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install balancer deps
        run: pip install 'httpx>=0.27' 'uvicorn[standard]>=0.29' 'pytest>=8' 'pytest-asyncio>=0.24'

      - name: Run balancer tests
        run: pytest balancer/tests/ -q
