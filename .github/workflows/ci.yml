name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install package with test deps
        run: pip install -e '.[test]'

      - name: Ruff (only if configured and installed)
        run: |
          if [ -f pyproject.toml ] && grep -q '^\[tool\.ruff\]' pyproject.toml && command -v ruff >/dev/null; then
            ruff check proxy_opencode tests
          else
            echo "ruff not installed or not configured, skipping"
          fi

      - name: Run tests
        run: pytest tests/ -q

  balancer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install balancer deps
        run: pip install 'httpx>=0.27' 'uvicorn[standard]>=0.29' 'pytest>=8' 'pytest-asyncio>=0.24'

      - name: Run balancer tests
        run: pytest balancer/tests/ -q
