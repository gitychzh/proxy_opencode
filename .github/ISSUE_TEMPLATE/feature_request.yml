name: Feature Request
description: 提出新能力建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不便 / 缺少什么
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 接口/行为上希望是什么样
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python 版本与部署方式
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 本请求不涉及风控绕过、免费额度滥用、指纹伪造或拿到/使用他人的真实上游 key
          required: true
